<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Specialist Clinic — Dr. Saleha Ibtisam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102D55"/>
      <stop offset="55%" stop-color="#163C6E"/>
      <stop offset="100%" stop-color="#2456A6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E83E8C"/>
      <stop offset="100%" stop-color="#D92D79"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="1080" cy="110" r="220" fill="#E83E8C" opacity="0.10"/>
  <circle cx="120" cy="560" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="1010" cy="470" r="90" fill="#E83E8C" opacity="0.08"/>

  <!-- accent bar -->
  <rect x="88" y="150" width="64" height="8" rx="4" fill="url(#accent)"/>

  <g transform="translate(88 196)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#9FC1F0">
      SPECIALIST CLINIC
    </text>
    <text x="0" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">
      Women&#8217;s health,</text>
    <text x="0" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">
      thoughtfully delivered.
    </text>
  </g>

  <!-- doctor line -->
  <g transform="translate(88 420)">
    <rect x="0" y="-34" width="4" height="34" rx="2" fill="url(#accent)"/>
    <text x="22" y="-8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF">
      Dr. Saleha Ibtisam
    </text>
    <text x="22" y="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#C9DDF6">
      Consultant Gynaecologist &#183; Rawalpindi
    </text>
  </g>

  <!-- hours pill -->
  <g transform="translate(88 512)">
    <rect x="0" y="0" width="330" height="52" rx="26" fill="#ffffff" opacity="0.10"/>
    <text x="26" y="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#E6EFFC">
      Evening clinic &#183; 6:00 PM &#8211; 9:00 PM
    </text>
  </g>
</svg>